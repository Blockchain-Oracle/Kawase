[package]
name = "kawase-desktop"
version = "1.0.0"
description = "Kawase for macOS, Windows and Linux: the live web app in a native window"
authors = ["Kawase"]
edition = "2021"
publish = false

[lib]
# The `_lib` suffix keeps the library's name apart from the binary's (a Cargo issue on Windows, rust-lang/cargo#8519).
name = "kawase_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-opener = "2.7.0"
# generate_context! embeds the plugins' configuration as JSON.
serde_json = "1"
url = "2"

# Windows and Linux start a second process for each kawase:// link; this hands the link to the running window.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5.2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
