<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Kawase architecture: one app, one agent, Arc and Circle</title>
<desc id="desc">The Kawase app sends chat and screens to the Kawase API. Voice travels over LiveKit Cloud to a voice worker and into the same agent turn. The API uses Postgres for state, Privy for identity, Arc for settlement, and Circle for wallet and money services.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowLight" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    text { font-family: Inter, Arial, Helvetica, sans-serif; fill: #111111; }
    .heavy { font-weight: 800; letter-spacing: -1.5px; }
    .medium { font-weight: 600; }
    .muted { fill: #666666; }
    .white { fill: #ffffff; }
    .quiet { fill: #bbbbbb; }
    .line { fill: none; stroke: #111111; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .softline { fill: none; stroke: #888888; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</defs>
<rect width="1920" height="1080" fill="#F5F5F5"/>
