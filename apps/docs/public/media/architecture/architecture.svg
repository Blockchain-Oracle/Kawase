<text x="158" y="105" class="heavy" font-size="46">Kawase</text>
<text x="1818" y="103" class="medium muted" font-size="24" text-anchor="end">Architecture / 01</text>
<path d="M74 154 H1846" stroke="#D8D8D8" stroke-width="2"/>
<text x="78" y="225" class="heavy" font-size="61">Under the hood</text>
<text x="78" y="269" class="muted" font-size="27">One app. One agent turn. Arc and Circle at the core.</text>

<!-- Connections: a single chat route, a single voice route, and one shared execution layer. -->
<path class="line" d="M546 476 H710" marker-end="url(#arrow)"/>
<rect x="555" y="425" width="159" height="36" rx="18" fill="#F5F5F5"/>
<text x="635" y="450" class="medium" text-anchor="middle" font-size="21">Chat + screens</text>
