<text x="1004" y="307" class="medium muted" text-anchor="middle" font-size="21">Voice · WebRTC audio</text>
<path class="softline" d="M1655 370 V393" marker-end="url(#arrowLight)"/>
<path class="line" d="M1392 530 H1259" marker-end="url(#arrow)"/>
<rect x="1266" y="478" width="116" height="35" rx="17" fill="#F5F5F5"/>
<text x="1324" y="503" class="medium" text-anchor="middle" font-size="21">Same turn</text>
