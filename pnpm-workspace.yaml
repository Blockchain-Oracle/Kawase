packages:
  - apps/*
  - packages/*
  - packages/integrations/*

# One place for every shared dependency version (D21). Packages reference these with "catalog:".
catalog:
  "@eslint/js": 10.0.1
  eslint: 10.11.0
  prettier: 3.9.9
  turbo: 2.11.5
  typescript: 6.0.3 # matches Expo SDK 57's template (spike 14)
  typescript-eslint: 8.71.0
  zod: 4.6.5
  viem: 2.57.0
  # DBOS SDK and drizzle-datasource must match (spike 06)
  "@dbos-inc/dbos-sdk": 5.2.11
  "@dbos-inc/drizzle-datasource": 5.2.11
  # AI SDK 7 (spike 07)
  ai: 7.0.122
  "@ai-sdk/react": 4.0.125
  # Model providers for the registry (D29; spike 07 used openai 4.0.82)
  "@ai-sdk/openai": 4.0.83
  "@ai-sdk/anthropic": 4.0.71
  # On-chain limits (spikes 04 and 15)
  "@metamask/smart-accounts-kit": 2.0.0
  "@circle-fin/developer-controlled-wallets": 10.8.1
  "@types/node": 24.19.0
  tsx: 4.23.15
  dotenv: 18.0.4
  # API and data (Stage 3)
  hono: 4.13.12
  "@hono/node-server": 2.1.3
  drizzle-orm: 0.45.3
  drizzle-kit: 0.31.11
  pg: 8.23.1
  "@types/pg": 8.23.1
  pino: 10.3.1
  uuidv7: 1.2.1
  # Turnkey, server side (the same versions the app's kit already uses)
  "@turnkey/http": 6.6.0
  "@turnkey/api-key-stamper": 0.6.17

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.71.0'
  - '@typescript-eslint/parser@8.71.0'
  - '@typescript-eslint/project-service@8.71.0'
  - '@typescript-eslint/scope-manager@8.71.0'
  - '@typescript-eslint/tsconfig-utils@8.71.0'
  - '@typescript-eslint/type-utils@8.71.0'
  - '@typescript-eslint/types@8.71.0'
  - '@typescript-eslint/typescript-estree@8.71.0'
  - '@typescript-eslint/utils@8.71.0'
  - '@typescript-eslint/visitor-keys@8.71.0'
  - typescript-eslint@8.71.0
  - '@expo/ui@57.0.21'
  - expo-constants@57.0.20
  - expo-modules-core@57.0.20
  - expo-router@57.0.24
  - expo@57.0.26
  - viem@2.57.0
  - hono@4.13.12
  - pg-cloudflare@1.4.1
  - pg-connection-string@2.14.1
  - pg-protocol@1.16.1
  - pg@8.23.1
  - '@ai-sdk/anthropic@4.0.71'
  - '@ai-sdk/openai@4.0.83'
  - '@ai-sdk/provider-utils@5.0.53'
  - '@ai-sdk/provider@4.0.21'
  - '@turnkey/core@2.12.1'
  - '@turnkey/react-wallet-kit@2.5.2'

# Expo native builds allow one version per native module (expo-doctor, spike 09)
overrides:
  expo-constants: 57.0.20
  # uniwind 1.12.0's web build breaks on react-native-web 0.21.3 (uni-stack/uniwind#695; fixed on main by #697,
  # not released yet). Remove this pin when a uniwind release after 1.12.0 is installed (spike 08).
  react-native-web: 0.21.2

# Install scripts: false = knowingly skipped (this one only prints a funding banner).
allowBuilds:
  react-native-inappbrowser-reborn: false
  # Optional native speed-ups for `ws` (pulled in by App Kit's Solana deps); the pure-JS fallback is fine on the api.
  bufferutil: false
  utf-8-validate: false
  # esbuild (through tsx, used to run TypeScript test scripts) verifies its platform binary.
  esbuild: true
  # Skia's install script only copies its prebuilt frameworks from sibling packages into place (no network).
  '@shopify/react-native-skia': true
  # The voice worker (LiveKit Agents): onnxruntime-node ships its CPU binaries for darwin/linux/win32 in the package;
  # its postinstall only fetches the CUDA add-on from NuGet, which a CPU worker does not use. protobufjs's postinstall
  # is a version notice; sharp ships prebuilt @img/sharp-* binaries. @livekit/local-inference fetches its models with
  # the worker's own `download-files` step, not at install.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  '@livekit/local-inference': false
